name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render and push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          # GitHub auto-generates a source tarball at /archive/refs/tags/<TAG>.tar.gz
          # for every tag. Compute its sha256 by streaming it through sha256sum.
          source_url="https://github.com/hra42/ai/archive/refs/tags/${TAG}.tar.gz"
          sha_source=$(curl -fsSL "$source_url" | sha256sum | awk '{print $1}')
          if [ -z "$sha_source" ]; then
            echo "failed to compute source tarball sha" >&2
            exit 1
          fi

          # Render the template.
          mkdir -p out/Formula
          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__SHA_SOURCE__|${sha_source}|g" \
            .github/homebrew/ai.rb.tmpl > out/Formula/ai.rb

          echo "::group::Rendered Formula/ai.rb"
          cat out/Formula/ai.rb
          echo "::endgroup::"

          # Push to the tap repo.
          git config --global user.name "goreleaserbot"
          git config --global user.email "bot@goreleaser.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/hra42/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/Formula/ai.rb tap/Formula/ai.rb
          cd tap
          git add Formula/ai.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "ai ${version}"
          git push origin HEAD
