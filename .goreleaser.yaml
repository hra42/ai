version: 2

project_name: ai

before:
  hooks:
    - go mod tidy

builds:
  - id: ai
    main: .
    binary: ai
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Chores
      regexp: '^.*?chore(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh

# Homebrew formula publishing is handled outside GoReleaser by the
# `homebrew` job in .github/workflows/release.yml — it renders
# .github/homebrew/ai.rb.tmpl with the version + sha256s from this
# release and pushes Formula/ai.rb into hra42/homebrew-tap.
